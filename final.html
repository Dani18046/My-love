<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🫵</title>
  <link rel="stylesheet" href="style_final.css">
</head>
<body>
  <audio autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <div class="contenedor">
    <h1 class="titulo">Chismosa..... 🫵</h1>
    <p class="mensaje">
       ......
    </p>

    <div class="cartas-fotos">
      <div class="foto">
        <img src="cartamano1.jpg" alt="Carta 1">
      </div>
      <div class="foto">
        <img src="cartamano2.jpg" alt="Carta 2">
      </div>
    </div>

    <p class="firma">Very, <br> <span>— Chismosaaa... 💌</span></p>

    <div class="brillos"></div>
  </div>

  <!-- Modal de imagen -->
  <div id="modal-imagen" class="modal-imagen">
    <span class="cerrar">&times;</span>
    <img class="imagen-grande" id="imagen-ampliada">
  </div>

  <script>
    // Brillos
    const brillos = document.querySelector('.brillos');
    function crearBrillo() {
      const span = document.createElement('span');
      span.classList.add('brillo');
      span.style.left = Math.random() * 100 + '%';
      span.style.animationDuration = (3 + Math.random() * 3) + 's';
      brillos.appendChild(span);
      setTimeout(() => span.remove(), 6000);
    }
    setInterval(crearBrillo, 400);

    // Modal de imagen
    const modal = document.getElementById("modal-imagen");
    const modalImg = document.getElementById("imagen-ampliada");
    const cerrar = document.querySelector(".cerrar");

    document.querySelectorAll(".foto img").forEach(img => {
      img.addEventListener("click", () => {
        modal.style.display = "flex";
        modalImg.src = img.src;
      });
    });

    cerrar.addEventListener("click", () => {
      modal.style.display = "none";
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.style.display = "none";
    });
  </script>

  <script>
  // Inicia la música cuando ella haga su primer clic en la página
  document.addEventListener("click", () => {
    const audio = document.querySelector("audio");
    if (audio && audio.paused) {
      audio.play().catch(() => {});
    }
  }, { once: true });
  </script>

</body>
</html>
